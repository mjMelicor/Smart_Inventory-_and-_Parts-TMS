services:
  - type: web
    name: smart-inventory-api
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run db:generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: BUSINESS_TIME_ZONE
        value: Asia/Manila
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
